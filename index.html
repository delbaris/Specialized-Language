<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
    <meta name="description"
        content="تِرمینو — پایگاه اصطلاحات تخصصی دوطرفه فارسی–انگلیسی با جست‌وجوی پیشرفته، دسته‌بندی حوزه‌ای و ابزار یادگیری. آفلاین و بدون نیاز به سرور.">
    <meta name="theme-color" content="#0f766e">
    <meta name="color-scheme" content="light dark">
    <title>تِرمینو — پایگاه اصطلاحات تخصصی فارسی ⇄ انگلیسی</title>
    <link rel="icon" id="favIcon" type="image/svg+xml" href="">
    <link rel="apple-touch-icon" id="favApple" href="">
    <link rel="manifest" href="manifest.webmanifest">
    <style>
        /* ============ توکن‌های طراحی ============ */
        :root {
            --bg: #f5f7fa;
            --bg2: #eef1f6;
            --surface: #ffffff;
            --surface2: #f2f5f9;
            --text: #101826;
            --muted: #5b6b7c;
            --faint: #8a99a8;
            --line: #e3e9f0;
            --line2: #d3dce6;
            --accent: #0d9488;
            --accent2: #0ea5a0;
            --accent-deep: #0f766e;
            --accent-soft: #e6f5f3;
            --accent-ring: rgba(13, 148, 136, .18);
            --blue: #3b82f6;
            --amber: #f59e0b;
            --rose: #f43f5e;
            --violet: #8b5cf6;
            --green: #22c55e;
            --slate: #64748b;
            --pink: #ec4899;
            --teal: #14b8a6;
            --lime: #84cc16;
            --danger: #dc2626;
            --warn: #b45309;
            --grad: linear-gradient(135deg, #0d9488 0%, #2563eb 100%);
            --grad-soft: linear-gradient(135deg, rgba(13, 148, 136, .10), rgba(37, 99, 235, .10));
            --shadow-sm: 0 1px 2px rgba(16, 24, 40, .05);
            --shadow: 0 1px 3px rgba(16, 24, 40, .07), 0 6px 18px rgba(16, 24, 40, .06);
            --shadow-lg: 0 4px 8px rgba(16, 24, 40, .08), 0 18px 44px rgba(16, 24, 40, .12);
            --radius: 14px;
            --radius-lg: 20px;
            --ltr: "Segoe UI", system-ui, -apple-system, Tahoma, Arial, sans-serif;
            --ease: cubic-bezier(.22, .61, .36, 1);
        }

        [data-theme="dark"] {
            --bg: #0b1117;
            --bg2: #0e1620;
            --surface: #121b26;
            --surface2: #182431;
            --text: #e8eef5;
            --muted: #9db0c2;
            --faint: #6b7f92;
            --line: #1f2c3a;
            --line2: #2a3a4b;
            --accent: #2dd4bf;
            --accent2: #38bdf8;
            --accent-deep: #14b8a6;
            --accent-soft: #0f2e2c;
            --accent-ring: rgba(45, 212, 191, .16);
            --grad: linear-gradient(135deg, #14b8a6 0%, #3b82f6 100%);
            --grad-soft: linear-gradient(135deg, rgba(20, 184, 166, .12), rgba(59, 130, 246, .12));
            --shadow-sm: 0 1px 2px rgba(0, 0, 0, .4);
            --shadow: 0 1px 3px rgba(0, 0, 0, .5), 0 8px 22px rgba(0, 0, 0, .35);
            --shadow-lg: 0 6px 14px rgba(0, 0, 0, .5), 0 24px 60px rgba(0, 0, 0, .5);
        }

        * {
            box-sizing: border-box
        }

        html {
            scroll-behavior: smooth
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: Vazirmatn, IRANSansX, "Segoe UI", Tahoma, "Noto Sans Arabic", sans-serif;
            font-size: 15px;
            line-height: 1.85;
            -webkit-font-smoothing: antialiased;
            transition: background .3s var(--ease), color .3s var(--ease)
        }

        .en {
            direction: ltr;
            unicode-bidi: isolate;
            font-family: var(--ltr)
        }

        a {
            color: var(--accent)
        }

        button {
            font-family: inherit;
            cursor: pointer
        }

        input,
        select,
        textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit
        }

        ::selection {
            background: var(--accent-ring)
        }

        :focus-visible {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
            border-radius: 8px
        }

        .skip {
            position: absolute;
            inset-inline-start: -999px;
            z-index: 300
        }

        .skip:focus {
            inset-inline-start: 12px;
            top: 12px;
            background: var(--surface);
            padding: 9px 16px;
            border-radius: 10px;
            box-shadow: var(--shadow)
        }

        .wrap {
            max-width: 1240px;
            margin: 0 auto;
            padding: 0 20px
        }

        .muted {
            color: var(--muted)
        }

        .small {
            font-size: 12.5px
        }

        .faint {
            color: var(--faint)
        }

        .ic {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex: 0 0 auto
        }

        /* ============ هدر ============ */
        .hdr {
            position: sticky;
            top: 0;
            z-index: 60;
            border-bottom: 1px solid var(--line);
            background: color-mix(in srgb, var(--bg) 78%, transparent);
            backdrop-filter: blur(14px) saturate(1.4);
            -webkit-backdrop-filter: blur(14px) saturate(1.4)
        }

        .hdr-in {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 64px
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 11px;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: -.2px;
            white-space: nowrap
        }

        .logo-mark {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: var(--grad);
            color: #fff;
            display: grid;
            place-items: center;
            box-shadow: 0 4px 14px var(--accent-ring)
        }

        .logo small {
            display: block;
            font-size: 10.5px;
            font-weight: 500;
            color: var(--faint);
            margin-top: -3px;
            letter-spacing: 0
        }

        .nav {
            display: flex;
            gap: 4px;
            margin-inline-start: auto;
            background: var(--surface2);
            padding: 5px;
            border-radius: 13px;
            border: 1px solid var(--line)
        }

        .nav button {
            display: flex;
            align-items: center;
            gap: 7px;
            background: none;
            border: 0;
            padding: 8px 14px;
            border-radius: 9px;
            color: var(--muted);
            font-weight: 600;
            font-size: 13.5px;
            transition: all .2s var(--ease)
        }

        .nav button:hover {
            color: var(--text)
        }

        .nav button[aria-current="true"] {
            color: #fff;
            background: var(--grad);
            box-shadow: 0 3px 10px var(--accent-ring)
        }

        .iconbtn {
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 11px;
            width: 40px;
            height: 40px;
            display: grid;
            place-items: center;
            color: var(--text);
            transition: all .2s var(--ease)
        }

        .iconbtn:hover {
            border-color: var(--accent);
            color: var(--accent);
            transform: translateY(-1px)
        }

        /* ============ هیرو ============ */
        .hero {
            position: relative;
            padding: 46px 0 14px;
            text-align: center;
            overflow: hidden
        }

        .hero::before,
        .hero::after {
            content: "";
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: .5;
            pointer-events: none;
            z-index: 0
        }

        .hero::before {
            width: 380px;
            height: 380px;
            background: radial-gradient(circle, rgba(13, 148, 136, .30), transparent 70%);
            top: -120px;
            inset-inline-start: -80px
        }

        .hero::after {
            width: 340px;
            height: 340px;
            background: radial-gradient(circle, rgba(59, 130, 246, .25), transparent 70%);
            top: -60px;
            inset-inline-end: -60px
        }

        .hero>* {
            position: relative;
            z-index: 1
        }

        .hero .kicker {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            background: var(--accent-soft);
            color: var(--accent-deep);
            border: 1px solid color-mix(in srgb, var(--accent) 25%, transparent);
            padding: 6px 15px;
            border-radius: 99px;
            font-size: 12.5px;
            font-weight: 700;
            margin-bottom: 16px
        }

        [data-theme="dark"] .hero .kicker {
            color: var(--accent)
        }

        .hero h1 {
            margin: 0 0 10px;
            font-size: clamp(24px, 4.2vw, 40px);
            font-weight: 800;
            letter-spacing: -.5px;
            line-height: 1.3
        }

        .hero h1 .grad {
            background: var(--grad);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent
        }

        .hero p {
            margin: 0 auto 26px;
            color: var(--muted);
            max-width: 620px;
            font-size: 15.5px
        }

        .sbox {
            position: relative;
            max-width: 720px;
            margin: 0 auto
        }

        .sbox .s-ic {
            position: absolute;
            inset-inline-start: 18px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--faint);
            pointer-events: none
        }

        .sbox input {
            width: 100%;
            padding: 17px 56px 17px 20px;
            font-size: 16.5px;
            border: 1.5px solid var(--line2);
            border-radius: 16px;
            background: var(--surface);
            box-shadow: var(--shadow);
            transition: all .25s var(--ease)
        }

        .sbox input::placeholder {
            color: var(--faint)
        }

        .sbox input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 4px var(--accent-ring), var(--shadow)
        }

        .dir-hint {
            position: absolute;
            inset-inline-end: 14px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 11px;
            color: var(--accent-deep);
            background: var(--accent-soft);
            padding: 4px 11px;
            border-radius: 99px;
            pointer-events: none;
            font-weight: 700;
            white-space: nowrap
        }

        [data-theme="dark"] .dir-hint {
            color: var(--accent)
        }

        .sug {
            position: absolute;
            top: calc(100% + 8px);
            inset-inline: 0;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 14px;
            box-shadow: var(--shadow-lg);
            z-index: 50;
            overflow: hidden;
            text-align: start;
            max-height: 340px;
            overflow-y: auto
        }

        .sug button {
            display: flex;
            gap: 12px;
            align-items: center;
            width: 100%;
            border: 0;
            background: none;
            padding: 12px 16px;
            color: var(--text);
            transition: background .15s
        }

        .sug button:hover {
            background: var(--accent-soft)
        }

        .sug .en {
            font-weight: 700
        }

        .sug .fa-eq {
            color: var(--muted);
            font-size: 13px
        }

        .stats-strip {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            justify-content: center;
            margin: 26px 0 4px
        }

        .stat {
            display: flex;
            align-items: center;
            gap: 12px;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 12px 20px;
            box-shadow: var(--shadow-sm);
            min-width: 150px;
            transition: all .2s var(--ease)
        }

        .stat:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow)
        }

        .stat .s-ic {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: grid;
            place-items: center;
            background: var(--grad-soft);
            color: var(--accent-deep)
        }

        [data-theme="dark"] .stat .s-ic {
            color: var(--accent)
        }

        .stat b {
            display: block;
            font-size: 19px;
            line-height: 1.2;
            font-weight: 800
        }

        .stat span {
            font-size: 11.5px;
            color: var(--muted)
        }

        /* ============ چیپ‌ها و فیلتر ============ */
        .chips {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 16px 0 8px;
            scrollbar-width: none
        }

        .chips::-webkit-scrollbar {
            display: none
        }

        .chip {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 99px;
            padding: 8px 16px;
            font-size: 13px;
            font-weight: 600;
            color: var(--muted);
            transition: all .2s var(--ease)
        }

        .chip:hover {
            border-color: var(--accent);
            color: var(--accent)
        }

        .chip.on {
            background: var(--grad);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-ring)
        }

        .fbar {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            align-items: center;
            margin: 12px 0
        }

        .fbar select,
        .btn {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: 11px;
            padding: 9px 13px;
            font-size: 13.5px;
            color: var(--text);
            transition: all .2s var(--ease)
        }

        .fbar select:hover,
        .btn:hover {
            border-color: var(--accent)
        }

        .btn {
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 7px
        }

        .btn.pri {
            background: var(--grad);
            border-color: transparent;
            color: #fff;
            box-shadow: 0 4px 12px var(--accent-ring)
        }

        .btn.pri:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--accent-ring)
        }

        .btn.sm {
            padding: 6px 11px;
            font-size: 12px;
            border-radius: 9px
        }

        .btn.ghost {
            background: transparent
        }

        .btn:disabled {
            opacity: .5;
            cursor: not-allowed
        }

        .res-head {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin: 18px 0 12px;
            color: var(--muted);
            font-size: 13px
        }

        .res-head b {
            color: var(--text)
        }

        .res-head .grow {
            flex: 1
        }

        /* ============ کارت‌های نتیجه ============ */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px
        }

        .card {
            position: relative;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 16px 18px;
            box-shadow: var(--shadow-sm);
            cursor: pointer;
            text-align: start;
            width: 100%;
            color: var(--text);
            transition: all .22s var(--ease);
            overflow: hidden;
            content-visibility: auto;
            contain-intrinsic-size: 0 150px;
            animation: fadeUp .35s var(--ease) both
        }

        .card::before {
            content: "";
            position: absolute;
            inset-inline-start: 0;
            top: 0;
            bottom: 0;
            width: 3px;
            background: var(--grad);
            opacity: 0;
            transition: opacity .22s var(--ease)
        }

        .card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow);
            border-color: color-mix(in srgb, var(--accent) 35%, var(--line))
        }

        .card:hover::before {
            opacity: 1
        }

        .card .term {
            font-weight: 800;
            font-size: 16.5px;
            margin: 0 0 3px;
            letter-spacing: -.2px
        }

        .card .eq {
            margin: 0 0 10px
        }

        .eq-i {
            display: flex;
            gap: 7px;
            align-items: center;
            flex-wrap: wrap
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(10px)
            }

            to {
                opacity: 1;
                transform: none
            }
        }

        /* ============ نشان‌ها ============ */
        .b {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            padding: 3px 9px;
            border-radius: 99px;
            background: var(--surface2);
            color: var(--muted);
            white-space: nowrap;
            font-weight: 600;
            border: 1px solid transparent
        }

        .b.lv {
            font-weight: 700
        }

        .b.acr {
            background: color-mix(in srgb, var(--amber) 14%, transparent);
            color: var(--amber);
            border-color: color-mix(in srgb, var(--amber) 28%, transparent);
            font-weight: 700
        }

        .b.tag {
            border: 1px dashed var(--line2);
            background: transparent;
            font-size: 10.5px
        }

        .b.dm {
            font-weight: 600
        }

        .g-engineering {
            --gc: var(--amber)
        }

        .g-computer {
            --gc: var(--blue)
        }

        .g-medical {
            --gc: var(--rose)
        }

        .g-basic {
            --gc: var(--violet)
        }

        .g-business {
            --gc: var(--green)
        }

        .g-law {
            --gc: var(--slate)
        }

        .g-humanities {
            --gc: var(--pink)
        }

        .g-earth {
            --gc: var(--teal)
        }

        .g-sport {
            --gc: var(--lime)
        }

        .b.dm {
            background: color-mix(in srgb, var(--gc, var(--slate)) 13%, transparent);
            color: var(--gc, var(--slate));
            border-color: color-mix(in srgb, var(--gc, var(--slate)) 26%, transparent)
        }

        .lv-general {
            --lc: var(--slate)
        }

        .lv-academic {
            --lc: var(--blue)
        }

        .lv-intermediate {
            --lc: var(--teal)
        }

        .lv-advanced {
            --lc: var(--violet)
        }

        .lv-professional {
            --lc: #0d9488
        }

        .lv-specialist {
            --lc: var(--pink)
        }

        .lv-highly {
            --lc: var(--rose)
        }

        .b.lv {
            background: color-mix(in srgb, var(--lc, var(--slate)) 13%, transparent);
            color: var(--lc, var(--slate));
            border-color: color-mix(in srgb, var(--lc, var(--slate)) 26%, transparent)
        }

        .card-foot {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px
        }

        /* ============ حالت خالی ============ */
        .empty {
            background: var(--surface);
            border: 1px dashed var(--line2);
            border-radius: var(--radius-lg);
            padding: 48px 24px;
            text-align: center;
            color: var(--muted)
        }

        .empty .e-ic {
            width: 64px;
            height: 64px;
            margin: 0 auto 14px;
            border-radius: 50%;
            background: var(--surface2);
            display: grid;
            place-items: center;
            color: var(--faint)
        }

        .empty h3 {
            color: var(--text);
            margin: 4px 0
        }

        .load-row {
            text-align: center;
            margin: 20px 0
        }

        /* ============ پنل جزئیات ============ */
        .ov {
            position: fixed;
            inset: 0;
            background: rgba(8, 12, 18, .5);
            backdrop-filter: blur(3px);
            z-index: 90;
            animation: fadeIn .25s var(--ease)
        }

        @keyframes fadeIn {
            from {
                opacity: 0
            }

            to {
                opacity: 1
            }
        }

        .sheet {
            position: fixed;
            top: 0;
            bottom: 0;
            inset-inline-end: 0;
            width: min(660px, 100%);
            background: var(--surface);
            z-index: 95;
            overflow-y: auto;
            border-inline-start: 1px solid var(--line);
            padding: 26px 26px 60px;
            box-shadow: var(--shadow-lg);
            animation: slideIn .32s var(--ease)
        }

        @keyframes slideIn {
            from {
                transform: translateX(-40px);
                opacity: 0
            }

            to {
                transform: none;
                opacity: 1
            }
        }

        .sheet h2 {
            margin: 6px 0 4px;
            font-size: 25px;
            font-weight: 800;
            letter-spacing: -.3px
        }

        .sheet-top {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 12px
        }

        .sec-t {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            font-weight: 800;
            color: var(--faint);
            letter-spacing: .3px;
            margin: 24px 0 8px;
            text-transform: uppercase
        }

        .sec-t::before {
            content: "";
            width: 4px;
            height: 14px;
            border-radius: 2px;
            background: var(--grad)
        }

        .def {
            background: var(--surface2);
            border: 1px solid var(--line);
            border-radius: var(--radius);
            padding: 14px 16px;
            font-size: 14.5px;
            line-height: 1.8
        }

        .rel-chip {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            border: 1px solid var(--line);
            background: var(--surface);
            border-radius: 99px;
            padding: 7px 14px;
            font-size: 13px;
            color: var(--text);
            font-weight: 600;
            transition: all .18s var(--ease)
        }

        .rel-chip:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--accent-soft);
            transform: translateY(-1px)
        }

        .chips-wrap {
            display: flex;
            flex-wrap: wrap;
            gap: 8px
        }

        .ex-blk {
            border-inline-start: 3px solid var(--accent);
            background: var(--accent-soft);
            border-radius: 12px;
            padding: 14px 18px;
            margin-top: 8px
        }

        .note-blk {
            background: color-mix(in srgb, var(--amber) 8%, var(--surface));
            border: 1px solid color-mix(in srgb, var(--amber) 28%, var(--line));
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13.5px
        }

        .x-close {
            position: absolute;
            top: 18px;
            inset-inline-end: 18px;
            z-index: 5
        }

        .action-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 18px 0
        }

        .eq-big {
            font-size: 17px;
            font-weight: 700
        }

        /* ============ پنل‌ها و نماها ============ */
        main {
            padding: 24px 0 100px
        }

        .panel {
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            padding: 22px;
            box-shadow: var(--shadow-sm);
            transition: all .22s var(--ease)
        }

        .panel:hover {
            box-shadow: var(--shadow)
        }

        .panel h3 {
            margin: 0 0 5px;
            font-size: 16.5px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 9px
        }

        .panel .sub {
            color: var(--muted);
            font-size: 13px;
            margin: 0 0 14px
        }

        .panel.click {
            cursor: pointer
        }

        .panel.click:hover {
            transform: translateY(-3px);
            border-color: color-mix(in srgb, var(--accent) 35%, var(--line))
        }

        .grid2 {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 16px
        }

        .p-ic {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--grad-soft);
            color: var(--accent-deep);
            display: grid;
            place-items: center;
            margin-bottom: 12px
        }

        [data-theme="dark"] .p-ic {
            color: var(--accent)
        }

        h2.page {
            font-size: 24px;
            font-weight: 800;
            margin: 6px 0 4px;
            letter-spacing: -.4px
        }

        p.page-sub {
            color: var(--muted);
            margin: 0 0 22px
        }

        /* ============ فلش‌کارت ============ */
        .fc-scene {
            perspective: 1400px;
            max-width: 540px;
            margin: 20px auto;
            height: 290px
        }

        .fc {
            position: relative;
            width: 100%;
            height: 100%;
            transform-style: preserve-3d;
            transition: transform .55s var(--ease);
            cursor: pointer
        }

        .fc.flip {
            transform: rotateY(180deg)
        }

        .fc-face {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            -webkit-backface-visibility: hidden;
            background: var(--surface);
            border: 1px solid var(--line);
            border-radius: var(--radius-lg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 26px;
            text-align: center;
            box-shadow: var(--shadow)
        }

        .fc-back {
            transform: rotateY(180deg);
            background: var(--grad);
            color: #fff;
            border-color: transparent
        }

        .fc-back .muted {
            color: rgba(255, 255, 255, .8)
        }

        .fc-face .big {
            font-size: 23px;
            font-weight: 800;
            line-height: 1.5
        }

        .fc-hint {
            position: absolute;
            bottom: 14px;
            font-size: 11px;
            color: var(--faint);
            display: flex;
            align-items: center;
            gap: 5px
        }

        .fc-back .fc-hint {
            color: rgba(255, 255, 255, .7)
        }

        /* ============ آزمون ============ */
        .q-opt {
            display: flex;
            align-items: center;
            width: 100%;
            text-align: start;
            border: 1.5px solid var(--line);
            background: var(--surface);
            border-radius: 12px;
            padding: 13px 16px;
            margin-bottom: 9px;
            font-size: 15px;
            transition: all .18s var(--ease);
            font-weight: 600
        }

        .q-opt:hover {
            border-color: var(--accent);
            background: var(--accent-soft)
        }

        .q-opt.ok {
            border-color: var(--green);
            background: color-mix(in srgb, var(--green) 12%, var(--surface))
        }

        .q-opt.bad {
            border-color: var(--danger);
            background: color-mix(in srgb, var(--danger) 10%, var(--surface))
        }

        .prog {
            height: 8px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden;
            margin: 12px 0
        }

        .prog i {
            display: block;
            height: 100%;
            background: var(--grad);
            border-radius: 99px;
            transition: width .4s var(--ease)
        }

        /* ============ آمار ============ */
        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 9px 0;
            font-size: 13px
        }

        .bar-row .nm {
            width: 190px;
            flex: 0 0 auto;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600
        }

        .bar {
            flex: 1;
            height: 12px;
            background: var(--surface2);
            border-radius: 99px;
            overflow: hidden
        }

        .bar i {
            display: block;
            height: 100%;
            background: var(--grad);
            border-radius: 99px
        }

        .bar-row .ct {
            width: 48px;
            color: var(--muted);
            font-size: 12px;
            text-align: end
        }

        /* ============ فهرست‌ها ============ */
        .list-item {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 11px 0;
            border-bottom: 1px solid var(--line)
        }

        .list-item:last-child {
            border-bottom: 0
        }

        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 9px;
            align-items: center
        }

        .tbl {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px
        }

        .tbl th,
        .tbl td {
            border: 1px solid var(--line);
            padding: 8px 11px;
            text-align: start
        }

        .soon {
            opacity: .6
        }

        /* ============ جفت‌یابی ============ */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 11px;
            max-width: 580px;
            margin: 16px auto
        }

        .match-grid button {
            border: 1.5px solid var(--line);
            background: var(--surface);
            border-radius: 12px;
            padding: 14px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
            transition: all .18s var(--ease)
        }

        .match-grid button:hover {
            border-color: var(--accent)
        }

        .match-grid button.sel {
            border-color: var(--accent);
            background: var(--accent-soft)
        }

        .match-grid button.done {
            opacity: .4;
            pointer-events: none;
            border-color: var(--green)
        }

        .match-grid button.flash {
            border-color: var(--danger);
            animation: shake .4s
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0)
            }

            25% {
                transform: translateX(-5px)
            }

            75% {
                transform: translateX(5px)
            }
        }

        .t-pass {
            color: var(--green);
            font-weight: 800
        }

        .t-fail {
            color: var(--danger);
            font-weight: 800
        }

        /* ============ اصطلاح روز ============ */
        .daily {
            display: flex;
            align-items: center;
            gap: 16px;
            background: var(--grad-soft);
            border: 1px solid color-mix(in srgb, var(--accent) 22%, transparent);
            border-radius: var(--radius-lg);
            padding: 18px 22px;
            margin: 16px 0;
            cursor: pointer;
            transition: all .22s var(--ease)
        }

        .daily:hover {
            transform: translateY(-2px);
            box-shadow: var(--shadow)
        }

        .daily .d-ic {
            width: 46px;
            height: 46px;
            border-radius: 13px;
            background: var(--grad);
            color: #fff;
            display: grid;
            place-items: center;
            flex: 0 0 auto
        }

        .daily .d-en {
            font-weight: 800;
            font-size: 16px
        }

        .daily .d-fa {
            color: var(--muted);
            font-size: 13.5px
        }

        /* ============ توست و ناوبری موبایل ============ */
        .toast {
            position: fixed;
            bottom: 24px;
            inset-inline-start: 50%;
            transform: translateX(50%);
            background: var(--text);
            color: var(--bg);
            padding: 11px 22px;
            border-radius: 99px;
            font-size: 13.5px;
            font-weight: 600;
            z-index: 200;
            box-shadow: var(--shadow-lg);
            animation: toastIn .3s var(--ease)
        }

        @keyframes toastIn {
            from {
                transform: translate(50%, 20px);
                opacity: 0
            }

            to {
                transform: translate(50%, 0);
                opacity: 1
            }
        }

        .bnav {
            display: none;
            position: fixed;
            bottom: 0;
            inset-inline: 0;
            z-index: 80;
            background: color-mix(in srgb, var(--surface) 90%, transparent);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border-top: 1px solid var(--line);
            padding: 8px 8px calc(8px + env(safe-area-inset-bottom))
        }

        .bnav button {
            flex: 1;
            background: none;
            border: 0;
            color: var(--faint);
            font-size: 10.5px;
            font-weight: 600;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            padding: 6px 2px;
            border-radius: 12px;
            transition: all .2s var(--ease)
        }

        .bnav button[aria-current="true"] {
            color: var(--accent)
        }

        .bnav button[aria-current="true"] .ic {
            transform: translateY(-2px)
        }

        @media (max-width:900px) {
            .nav {
                display: none
            }

            .bnav {
                display: flex
            }

            .hdr-in {
                height: 58px
            }

            /* رفع باگ: سلکتور main.wrap اولویت بالاتری از .wrap دارد تا padding-bottom واقعاً اعمال شود؛
     مقدار نیز همگام با منوی پایین، ناحیهٔ امن دستگاه را شامل می‌شود */
            main.wrap {
                padding-bottom: 120px
            }

            main.wrap {
                padding-bottom: calc(120px + env(safe-area-inset-bottom, 0px))
            }

            .toast {
                bottom: 84px
            }

            .toast {
                bottom: calc(90px + env(safe-area-inset-bottom, 0px))
            }
        }

        @media (max-width:520px) {
            .grid {
                grid-template-columns: 1fr
            }

            .match-grid {
                grid-template-columns: 1fr
            }

            .bar-row .nm {
                width: 130px
            }
        }

        @media (prefers-reduced-motion:reduce) {

            *,
            *::before,
            *::after {
                animation-duration: .01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: .01ms !important;
                scroll-behavior: auto !important
            }
        }
    </style>
</head>

        const Store = {
            ns: 'termino.v1.',
            get(k, d) { try { const v = localStorage.getItem(this.ns + k); return v === null ? d : JSON.parse(v) } catch (e) { return d } },
            set(k, v) { try { localStorage.setItem(this.ns + k, JSON.stringify(v)) } catch (e) { } }
        };

        /* =====================================================================
           MODULE: NORMALIZATION
        ===================================================================== */
        const Norm = {
            fa(s) {
                return String(s).replace(/[\u064B-\u0652\u0670\u0640]/g, '')
                    .replace(/[أإآٱ]/g, 'ا').replace(/ؤ/g, 'و').replace(/[يى]/g, 'ی')
                    .replace(/ك/g, 'ک').replace(/ة/g, 'ه')
                    .replace(/[\u200C\u200F\u200E]/g, ' ').replace(/\s+/g, ' ').trim()
            },
            en(s) {
                return String(s).toLowerCase().replace(/['’]s\b/g, '')
                    .replace(/&/g, ' and ').replace(/[^a-z0-9+#/.]+/g, ' ')
                    .replace(/\s+/g, ' ').trim()
            },
            deplural(s) {
                const out = new Set([s]);
                if (/[a-z]$/.test(s)) {
                    if (s.length > 4 && s.endsWith('ies')) out.add(s.slice(0, -3) + 'y');
                    if (s.length > 3 && s.endsWith('es')) out.add(s.slice(0, -2));
                    if (s.length > 3 && s.endsWith('s') && !s.endsWith('ss')) out.add(s.slice(0, -1));
                }
                return out
            },
            isFa(s) { return /[\u0600-\u06FF]/.test(s) }
        };

        /* =====================================================================
           MODULE: INDEX
        ===================================================================== */
        const IDX = { map: new Map(), tok: new Map(), phr: new Map(), errors: [], custom: [] };
        const FW = { t: 500, f: 480, a: 450, ab: 300, s: 380, r: 240, c: 240, d: 120 };
        function faTerms(e) { return e.fa.map(x => typeof x === 'string' ? x : x.t) }
        function validate(e, seen) {
            const errs = [];
            if (!e.id || typeof e.id !== 'string') errs.push('id نامعتبر');
            if (!e.en || !e.en.trim()) errs.push('en خالی');
            if (!Array.isArray(e.fa) || !e.fa.length || faTerms(e).some(t => !t)) errs.push('fa خالی');
            if (!e.def || !e.def.trim()) errs.push('def خالی');
            if (!Array.isArray(e.dom) || !e.dom.length || e.dom.some(d => !DOMAIN[d])) errs.push('dom نامعتبر');
            if (!e.sub) errs.push('sub خالی');
            if (!LEVELS[e.level]) errs.push('level نامعتبر');
            if (!POS[e.pos]) errs.push('pos نامعتبر');
            if (seen && e.id && seen.has(e.id)) errs.push('id تکراری');
            return errs;
        }
        function regTok(t, id, f) { if (!t) return; let a = IDX.tok.get(t); if (!a) { a = []; IDX.tok.set(t, a) } a.push({ id, f }) }
        function addEntry(e) {
            const v = validate(e);
            if (v.length) { IDX.errors.push({ id: e.id || '?', problems: v }); return false }
            const nEn = Norm.en(e.en);
            if (IDX.phr.has('en:' + nEn) && IDX.phr.get('en:' + nEn) !== e.id) { IDX.errors.push({ id: e.id, problems: ['عنوان انگلیسی تکراری'] }); return false }
            IDX.map.set(e.id, e); IDX.phr.set('en:' + nEn, e.id);
            nEn.split(' ').forEach(t => regTok(t, e.id, 't'));
            faTerms(e).forEach(fq => { const n = Norm.fa(fq); IDX.phr.set('fa:' + n, e.id); n.split(' ').forEach(t => regTok(t, e.id, 'f')) });
            (e.acr || []).forEach(a => { const n = Norm.en(a); IDX.phr.set('ac:' + n, e.id); regTok(n, e.id, 'a') });
            (e.abr || []).forEach(a => regTok(Norm.en(a), e.id, 'ab'));
            (e.syn || []).forEach(s => { const n = Norm.en(s); regTok(n, e.id, 's'); n.split(' ').forEach(t => regTok(t, e.id, 's')) });
            (e.rel || []).forEach(s => Norm.en(s).split(' ').forEach(t => regTok(t, e.id, 'r')));
            (e.col || []).forEach(s => Norm.en(s).split(' ').forEach(t => regTok(t, e.id, 'c')));
            Norm.en(e.def).split(' ').forEach(t => regTok(t, e.id, 'd'));
            return true;
        }
        RAW.forEach(e => addEntry(e));
        (Store.get('custom', [])).forEach(e => { e.user = true; addEntry(e) });
        IDX.custom = Store.get('custom', []);
        function lev(a, b) {
            if (Math.abs(a.length - b.length) > 2) return 3;
            const m = a.length, n = b.length, d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
            for (let j = 0; j <= n; j++)d[0][j] = j;
            for (let i = 1; i <= m; i++) {
                let best = n + 1;
                for (let j = 1; j <= n; j++) { d[i][j] = Math.min(d[i - 1][j] + 1, d[i][j - 1] + 1, d[i - 1][j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1)); best = Math.min(best, d[i][j]) }
                if (best > 2) return 3
            }
            return d[m][n];
        }
        function lookupVariants(v) {
            const hits = [];
            for (const cand of v) { const a = IDX.tok.get(cand); if (a) a.forEach(h => hits.push({ h, f: 1 })) }
            return hits
        }
        function search(q, flt) {
            const q0 = q.trim(); if (!q0) return [];
            const isFa = Norm.isFa(q0);
            const qn = isFa ? Norm.fa(q0) : Norm.en(q0);
            if (!qn) return [];
            const scores = new Map();
            const add = (id, sc) => scores.set(id, (scores.get(id) || 0) + sc);
            for (const [k, id] of IDX.phr) {
                if (k === ('en:' + qn)) add(id, 1200);
                else if (k === ('fa:' + qn) || k === ('ac:' + qn)) add(id, 1100);
                else if (k.startsWith('en:') && k.length > 4 && k.includes(qn)) add(id, 650);
                else if (k.startsWith('fa:') && k.length > 3 && k.includes(qn)) add(id, 600);
            }
            const tokens = qn.split(' ').filter(t => t.length > 0);
            for (const tk of tokens) {
                const variants = (!isFa && /[a-z]/.test(tk)) ? Norm.deplural(tk) : new Set([tk]);
                let hitAny = false;
                for (const { h, f } of lookupVariants(variants)) { add(h.id, FW[h.f] * f); hitAny = true }
                let pc = 0;
                for (const key of IDX.tok.keys()) {
                    if (pc > 250) break;
                    if (key !== tk && key.startsWith(tk) && tk.length >= 2) {
                        const a = IDX.tok.get(key);
                        a.slice(0, 4).forEach(h => add(h.id, Math.round(FW[h.f] * 0.7))); pc++; hitAny = true
                    }
                }
                if (!hitAny && tk.length >= 4) {
                    let fc = 0;
                    for (const key of IDX.tok.keys()) {
                        if (fc > 3) break;
                        if (lev(tk, key) <= 2) { IDX.tok.get(key).slice(0, 4).forEach(h => add(h.id, 90)); fc++; }
                    }
                }
            }
            let out = [];
            for (const [id, sc] of scores) {
                const e = IDX.map.get(id); if (!e) continue;
                if (flt.dom !== 'all' && !e.dom.includes(flt.dom)) continue;
                if (flt.sub !== 'all' && e.sub !== flt.sub) continue;
                if (flt.level !== 'all' && e.level !== flt.level) continue;
                if (flt.type === 'acr' && !(e.acr && e.acr.length) && e.pos !== 'acr' && e.pos !== 'ab') continue;
                if (flt.type === 'phrase' && !e.en.includes(' ')) continue;
                if (flt.type === 'single' && e.en.includes(' ')) continue;
                out.push({ id, sc });
            }
            out.sort((a, b) => b.sc - a.sc || IDX.map.get(a.id).en.localeCompare(IDX.map.get(b.id).en));
            return out;
        }
        function suggest(q) {
            const qn = Norm.isFa(q) ? Norm.fa(q) : Norm.en(q); if (qn.length < 1) return [];
            const out = [];
            for (const [k, id] of IDX.phr) {
                if (out.length >= 8) break;
                const p = k.indexOf(':'); const t = k.slice(p + 1);
                if (t.startsWith(qn) && out.findIndex(o => o.id === id) < 0) out.push({ id, t });
            }
            return out;
        }
        const ALL = [...IDX.map.keys()];
        function resolveRel(name) { return IDX.phr.get('en:' + Norm.en(name)) || null }
        function similar(e, n = 6) {
            const mine = new Set(Norm.en(e.en).split(' ')); let out = [];
            for (const o of IDX.map.values()) {
                if (o.id === e.id) continue;
                let s = 0; if (o.sub === e.sub && o.dom.some(d => e.dom.includes(d))) s += 2;
                Norm.en(o.en).split(' ').forEach(t => { if (mine.has(t)) s += 3 });
                (o.rel || []).forEach(r => { if (Norm.en(r) === Norm.en(e.en)) s += 5 });
                if (s > 0) out.push({ id: o.id, s });
            }

        function normalizeImport(it) {
            const en = it.en || it.term || '';
            const fa = Array.isArray(it.fa) ? it.fa : (it.fa ? [it.fa] : []);
            let doms = Array.isArray(it.domain) ? it.domain : (it.domain ? String(it.domain).split(/[|,]/) : []);
            doms = doms.map(d => d.trim()).filter(d => DOMAIN[d]); if (!doms.length) doms = ['biz'];
            return {
                en: String(en).trim(), fa: fa.map(String), def: String(it.definition || it.def || en).trim(),
                dom: doms, sub: String(it.subdomain || it.sub || 'واردشده').trim() || 'واردشده',
                level: LEVELS[it.level] ? it.level : 'academic', pos: POS[it.pos] ? it.pos : (String(en).includes(' ') ? 'np' : 'n')
            };
        }
        function parseCSV(txt) {
            const lines = txt.replace(/\r/g, '').split('\n').filter(l => l.trim()); if (lines.length < 2) return [];
            const cells = l => {
                const out = []; let cur = '', inq = false;
                for (let i = 0; i < l.length; i++) {
                    const ch = l[i];
                    if (inq) { if (ch === '"') { if (l[i + 1] === '"') { cur += '"'; i++ } else inq = false } else cur += ch }
                    else { if (ch === '"') inq = true; else if (ch === ',') { out.push(cur); cur = '' } else cur += ch }
                }
                out.push(cur); return out
            };
            const head = cells(lines[0]).map(h => h.trim().toLowerCase());
            return lines.slice(1).map(l => { const c = cells(l); const o = {}; head.forEach((h, i) => o[h] = (c[i] || '').trim()); return o });
        }
        function listRow(id, onRemove) {
            const e = IDX.map.get(id); if (!e) return el('div');
            const row = el('div', { class: 'list-item' });
            row.appendChild(el('button', { class: 'btn sm', style: { flex: '1', textAlign: 'start', justifyContent: 'flex-start' }, onclick: () => navTo('t', id) },
                [el('span', { class: 'en', dir: 'ltr', style: { fontWeight: '700' } }, [e.en]), el('span', { class: 'muted' }, [' — ' + faStr(e.fa[0])])]));
            if (onRemove) row.appendChild(el('button', { class: 'btn sm', onclick: onRemove, 'aria-label': 'حذف' }, [icon('x', 13)]));
            return row
        }

        /* ---------- آمار ---------- */
        function viewStats(main) {
            main.appendChild(el('h2', { class: 'page' }, ['آمار']));
            const g = el('div', { class: 'grid2' });
            const st = Store.get('streak', { n: 0 });
            [[IDX.map.size, 'مدخل‌های پایگاه', 'book'], [Object.keys(DOMAIN).length, 'حوزه‌های تخصصی', 'layers'],
            [[...IDX.map.values()].filter(e => e.acr && e.acr.length).length, 'سرنام‌ها', 'target'],
            [State.learned.size, 'واژه‌های آموخته‌شده', 'check'], [(st.n || 0), 'روزهای متوالی مراجعه', 'flame'],
            [State.quiz.played, 'آزمون‌های انجام‌شده', 'play'],
            [State.quiz.total ? Math.round(State.quiz.correct / State.quiz.total * 100) + '٪' : '—', 'دقت آزمون‌ها', 'chart'],
            [State.hist.length, 'جست‌وجوهای ثبت‌شده', 'search']].forEach(([v, l, ic]) => {
                const c = el('div', { class: 'panel' });
                c.appendChild(el('span', { class: 'p-ic', style: { marginBottom: '10px' } }, [icon(ic, 20)]));
                c.appendChild(el('b', { style: { fontSize: '24px', display: 'block', fontWeight: '800' } }, [typeof v === 'number' ? v.toLocaleString('fa') : v]));
                c.appendChild(el('span', { class: 'muted small' }, [l])); g.appendChild(c)
            });
            main.appendChild(g);
            main.appendChild(el('h3', { style: { marginTop: '26px' } }, ['توزیع مدخل‌ها بر اساس حوزه']));
            const cnt = {};[...IDX.map.values()].forEach(e => e.dom.forEach(d => cnt[d] = (cnt[d] || 0) + 1));
            const max = Math.max(...Object.values(cnt), 1);
            const panel = el('div', { class: 'panel' });
            Object.entries(cnt).sort((a, b) => b[1] - a[1]).forEach(([d, n]) => {
                const row = el('div', { class: 'bar-row' });
                row.appendChild(el('span', { class: 'nm' }, [DOMAIN[d] || d]));
                row.appendChild(el('span', { class: 'bar' }, [el('i', { style: { width: Math.round(n / max * 100) + '%' } })]));
                row.appendChild(el('span', { class: 'ct' }, [n.toLocaleString('fa')]));
                panel.appendChild(row)
            });
            main.appendChild(panel);
            main.appendChild(el('h3', { style: { marginTop: '26px' } }, ['توزیع بر اساس سطح تخصص']));
            const cnt2 = {};[...IDX.map.values()].forEach(e => cnt2[e.level] = (cnt2[e.level] || 0) + 1);
            const max2 = Math.max(...Object.values(cnt2), 1);
            const p2 = el('div', { class: 'panel' });
            Object.entries(cnt2).sort((a, b) => b[1] - a[1]).forEach(([l, n]) => {
                const row = el('div', { class: 'bar-row' });
                row.appendChild(el('span', { class: 'nm' }, [LEVELS[l]]));
                row.appendChild(el('span', { class: 'bar' }, [el('i', { style: { width: Math.round(n / max2 * 100) + '%' } })]));
                row.appendChild(el('span', { class: 'ct' }, [n.toLocaleString('fa')]));
                p2.appendChild(row)
            });
            main.appendChild(p2);
        }

        /* ---------- درباره + تست ---------- */
        function viewAbout(main) {
            main.appendChild(el('h2', { class: 'page' }, ['درباره تِرمینو']));
            const p = el('div', { class: 'panel' });
            p.appendChild(el('p', {}, ['تِرمینو یک پایگاه اصطلاحات تخصصی دوطرفهٔ فارسی–انگلیسی است: جست‌وجوی پیشرفته، فیلتر حوزه/زیرحوزه/سطح، صفحه جزئیات کامل، فهرست‌های شخصی، و ابزارهای یادگیری. همه‌چیز آفلاین و در مرورگر شما اجرا می‌شود و هیچ داده‌ای به سرور ارسال نمی‌شود.']));
            p.appendChild(el('div', { class: 'sec-t' }, ['سیاست کیفیت داده']));
            p.appendChild(el('p', { class: 'small' }, ['فقط اصطلاحات واقعی با معادل‌های رایج دانشگاهی/صنعتی وارد هسته شده‌اند. منبع جعلی ثبت نمی‌شود؛ مدخل‌های وارداتی کاربر نیز اعتبارسنجی و جدا از هسته نگه‌داری می‌شوند.']));
            p.appendChild(el('div', { class: 'sec-t' }, ['نقشه راه (به‌زودی — هنوز پیاده نشده)']));
            const ul = el('ul', { class: 'soon small' });
            ['تلفظ و تبدیل متن به گفتار', 'پکیج‌های واژگانی دانشگاهی/صنعتی', 'تکرار فاصله‌دار (Spaced Repetition)', 'همگام‌سازی ابری و حساب کاربری', 'خروجی Excel', 'جست‌وجوی معنایی'].forEach(x => ul.appendChild(el('li', {}, [x])));
            p.appendChild(ul);
            main.appendChild(p);
            const tp = el('div', { class: 'panel', style: { marginTop: '16px' } });
            tp.appendChild(el('div', { class: 'row' }, [el('h3', { style: { flex: '1' } }, [icon('check', 18), ' آزمون‌های داخلی']),
            el('button', { class: 'btn pri', onclick: renderTests }, [icon('play', 14), ' اجرای تست‌ها'])]));
            tp.appendChild(el('div', { id: 'testOut' }));
            main.appendChild(tp);
            if (location.hash.includes('tests')) renderTests();
        }
        function renderTests() {
            const out = document.getElementById('testOut'); if (!out) return; out.textContent = '';
            const R = [];
            const t = (name, fn) => { try { const r = fn(); R.push({ name, ok: !!r, why: r ? '' : 'ناموفق' }) } catch (e) { R.push({ name, ok: false, why: String(e) }) } };
            t('نرمال‌سازی فارسی: ی/ک/نیم‌فاصله', () => Norm.fa('نگهدارى‌پيشگيرانه') === Norm.fa('نگهداری پیشگیرانه'));
            t('نرمال‌سازی انگلیسی: هایفن و حالت حروف', () => Norm.en('Machine-Learning') === Norm.en('machine learning'));
            t('جست‌وجوی سرنام: FMEA', () => search('FMEA', { dom: 'all', sub: 'all', level: 'all', type: 'all' })[0]?.id === 'fmea');
            t('جست‌وجوی فارسی: پایش وضعیت', () => search('پایش وضعیت', { dom: 'all', sub: 'all', level: 'all', type: 'all' }).some(r => r.id === 'cm'));
            t('جست‌وجوی کلیدواژه: خرابی', () => { const s = search('خرابی', { dom: 'all', sub: 'all', level: 'all', type: 'all' }).map(r => r.id); return s.includes('failure') && s.includes('breakdown') });
            t('چندمعنایی: Cell در دو حوزه ثبت شده', () => IDX.map.get('cell').dom.length >= 2);
            t('جمع انگلیسی: failures به failure می‌رسد', () => search('failures', { dom: 'all', sub: 'all', level: 'all', type: 'all' }).some(r => r.id === 'failure'));
            t('عدم تکرار id در داده هسته', () => new Set(RAW.map(e => e.id)).size === RAW.length);
            t('اعتبارسنجی: همه مدخل‌های هسته معتبرند', () => !RAW.some(e => validate(e).length > 0));
            t('اعتبارسنجی: مدخل بدون en رد می‌شود', () => validate({ id: 'x', en: '', fa: ['الف'], def: 'd', dom: ['med'], sub: 's', level: 'academic', pos: 'n' }).length > 0);
            t('اعتبارسنجی: domain نامعتبر رد می‌شود', () => validate({ id: 'x', en: 'X', fa: ['الف'], def: 'd', dom: ['nope'], sub: 's', level: 'academic', pos: 'n' }).length > 0);
            t('علاقه‌مندی: افزودن و حذف', () => { const k = '__t'; State.fav.add(k); const a = State.fav.has(k); State.fav.delete(k); return a && !State.fav.has(k) });
            t('بارگذاری نمایه: تعداد مدخل‌ها برابر تعداد معتبرهاست', () => IDX.map.size === RAW.filter(e => !validate(e).length).length + IDX.custom.filter(e => !validate(e).length).length);
            t('پیشنهاد: پیشوند process', () => suggest('process').some(s => s.t.startsWith('process')));
            const tbl = el('table', { class: 'tbl', style: { marginTop: '12px' } });
            const pass = R.filter(x => x.ok).length;
            R.forEach(r => {
                const tr = el('tr');
                tr.appendChild(el('td', { class: r.ok ? 't-pass' : 't-fail' }, [r.ok ? '✓' : '✗']));
                tr.appendChild(el('td', {}, [r.name])); tr.appendChild(el('td', { class: 'muted small' }, [r.why]));
                tbl.appendChild(tr)
            });
            out.appendChild(el('p', { style: { marginTop: '12px', fontWeight: '700' } }, [pass.toLocaleString('fa') + ' از ' + R.length.toLocaleString('fa') + ' تست موفق']));
            out.appendChild(tbl);
        }

        /* =====================================================================
           MODULE: APP
        ===================================================================== */
        function buildNav() {
            const top = document.getElementById('navTop'), bot = document.getElementById('navBottom');
            NAV.forEach(([v, l, ic]) => {
                const b = el('button', { 'data-nav': v, onclick: () => navTo(v) }, [icon(ic, 16), l]); top.appendChild(b);
                const b2 = el('button', { 'data-nav': v, onclick: () => navTo(v) }, [icon(ic, 20), l]); bot.appendChild(b2)
            });
        }
        function applyTheme() {
            const t = State.theme; const sys = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
            document.documentElement.dataset.theme = (t === 'dark' || (t === 'system' && sys)) ? 'dark' : 'light';
            updateThemeIcon();
        }
        function updateThemeIcon() {
            const b = document.getElementById('themeBtn'); b.textContent = '';
            const ic = State.theme === 'light' ? 'sun' : State.theme === 'dark' ? 'moon' : 'monitor';
            b.appendChild(icon(ic, 18));
        }
        document.getElementById('themeBtn').addEventListener('click', () => {
            State.theme = State.theme === 'light' ? 'dark' : State.theme === 'dark' ? 'system' : 'light';
            State.save(); applyTheme();
            toast(State.theme === 'light' ? 'پوسته روشن' : State.theme === 'dark' ? 'پوسته تیره' : 'پوسته سیستمی')
        });
        window.addEventListener('hashchange', render);
        window.addEventListener('keydown', ev => {
            if (ev.key === '/' && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'SELECT') {
                const inp = document.querySelector('.sbox input'); if (inp) { ev.preventDefault(); inp.focus() }
            }
        });
        buildNav(); applyTheme(); render();
        if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
            navigator.serviceWorker.register('sw.js').catch(() => { });
        }
        console.log('Termino ready — entries:', IDX.map.size, '| rejected:', IDX.errors.length);
        if (IDX.errors.length) console.warn('Rejected entries:', IDX.errors);
    </script>
</body>
